name: CI/CD Quality Gate & Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Quality Gate & Tests (29 Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://brewlite:brewlite@localhost:5432/brewlite"
        run: npx prisma generate

      - name: Run Automated Tests (Jest 29/29 Passed)
        run: npm test

      - name: Build Backend (NestJS)
        run: npm run build

  frontend-build:
    name: Frontend Quality Gate & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Build Frontend (Next.js Turbopack)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: npm run build
